name: Tests

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      # Même prérequis que Deploy GitHub Pages : le manifeste data/cache est gitignoré.
      - run: npm run sync:data
      - run: npm test
      - run: npm run build
        env:
          ASTRO_SITE: https://lemediadupremiertour.fr
      - run: npm run check:canonical
